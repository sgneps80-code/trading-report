name: Diagnostica ETF

# Solo avvio manuale: si lancia dalla tab "Actions" del repository.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests

      - name: Mostra struttura del repository
        # Serve a vedere dove si trovano davvero i file, se qualcosa non torna.
        run: |
          echo "=== File nella radice ==="
          ls -la
          echo ""
          echo "=== Tutti i file .py nel repo ==="
          find . -name "*.py" -not -path "./.git/*" || true

      - name: Esegui tutte le diagnostiche
        # Esegue OGNI script che corrisponde al pattern, in ordine, accodando
        # l'output in un unico file. Cosi' aggiungere un nuovo script non
        # richiede di modificare il workflow.
        continue-on-error: true
        run: |
          SCRIPTS=$(find . -iname "diagnose*etf*.py" -not -path "./.git/*" | sort)
          if [ -z "$SCRIPTS" ]; then
            echo "::error::Nessuno script diagnostico trovato nel repository."
            exit 1
          fi
          echo "Script trovati:"
          echo "$SCRIPTS"
          echo "$SCRIPTS" | while IFS= read -r S; do
            echo ""                                    | tee -a diagnostica.txt
            echo "############################################" | tee -a diagnostica.txt
            echo "### ESECUZIONE: $S"                  | tee -a diagnostica.txt
            echo "############################################" | tee -a diagnostica.txt
            python "$S" 2>&1 | tee -a diagnostica.txt
          done

      - name: Info sul runner
        if: always()
        # L'IP del runner serve a capire se TradingView blocca i datacenter.
        run: |
          echo "=== IP pubblico del runner GitHub ===" | tee -a diagnostica.txt
          curl -s https://api.ipify.org | tee -a diagnostica.txt
          echo "" | tee -a diagnostica.txt

      - name: Salva risultato come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostica-etf
          path: diagnostica.txt
          retention-days: 7
