name: Analisi tecnica

# Avviato dal pulsante "Titolo"/"Portafoglio" nella sezione
# "Analisi tecnica per Claude" della pagina del report. Genera il file .md,
# lo CIFRA con una chiave casuale creata dalla pagina per questa sola richiesta
# e lo pubblica sul branch analisi-output, da dove la pagina lo scarica e lo decifra.
# Il repo è pubblico: nessun dato personale in chiaro né nei log né nei file.

run-name: "analisi ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Identificativo casuale generato dalla pagina'
        required: true
      modo:
        description: 'titolo oppure portafoglio'
        required: true
        default: 'titolo'
      simbolo:
        description: 'Simbolo Yahoo (solo modo titolo)'
        required: false
        default: ''
      config_json:
        description: 'Watchlist, posizioni e liquidità dalla pagina (dato personale: mascherato)'
        required: false
        default: '{}'
      chiave:
        description: 'Chiave AES casuale di questa richiesta, base64 (mascherata)'
        required: false
        default: ''
      prova:
        description: 'Solo per file di prova con dati fittizi marcati dati_di_prova: output non cifrato'
        required: false
        default: 'false'

permissions:
  contents: write

# Nessun gruppo di concorrenza: GitHub ne terrebbe in coda una sola e
# annullerebbe le richieste intermedie. Le richieste girano in parallelo e la
# pubblicazione si protegge da sola con --force-with-lease (vedi sotto).

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maschera i dati personali prima di ogni altro log
        # Stesso schema di trading_report.yml: il valore si legge dal payload
        # dell'evento a runtime, mai con ${{ }} nel testo del comando.
        run: |
          for campo in config_json chiave; do
            valore=$(python3 -c "import json; print(json.load(open('$GITHUB_EVENT_PATH', encoding='utf-8')).get('inputs', {}).get('$campo') or '')")
            if [ -n "$valore" ] && [ "$valore" != "{}" ]; then
              echo "::add-mask::$valore"
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-analisi.txt

      - name: Genera il file
        env:
          ANALISI_OUT: out_analisi
        run: python genera_analisi.py --da-evento

      - name: Pubblica sul branch analisi-output
        env:
          GH_TOKEN: ${{ github.token }}
        # Branch "usa e getta": un solo commit (orfano) con i file delle
        # ultime 24 ore, riscritto a ogni richiesta. Nessuna storia accumulata.
        # Se nel frattempo un'altra richiesta ha pubblicato, il push con
        # --force-with-lease viene rifiutato e si riparte dallo stato nuovo.
        run: |
          set -uo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for tentativo in 1 2 3 4 5 6; do
            rm -rf pub && mkdir pub && cd pub
            git init -q && git checkout -q --orphan analisi-output
            base=""
            if git fetch -q --depth 1 "$remote" analisi-output 2>/dev/null; then
              base=$(git rev-parse FETCH_HEAD)
              git checkout -q FETCH_HEAD -- . || true
            fi
            adesso=$(date +%s)
            touch indice.txt
            awk -v t="$adesso" '$1 > t - 86400' indice.txt > indice.nuovo || true
            for f in *; do
              case "$f" in indice.txt|indice.nuovo) continue;; esac
              id="${f%.*}"
              grep -q " ${id}\$" indice.nuovo || rm -f "$f"
            done
            for f in ../out_analisi/*; do
              cp "$f" .
              b=$(basename "$f"); echo "$adesso ${b%.*}" >> indice.nuovo
            done
            sort -u indice.nuovo > indice.txt && rm indice.nuovo
            git add -A
            git -c user.name="trading-bot" -c user.email="bot@trading-report" commit -qm "analisi $(date -u +%FT%TZ)"
            if git push -q --force-with-lease="refs/heads/analisi-output:${base}" "$remote" HEAD:refs/heads/analisi-output; then
              echo "Pubblicato al tentativo $tentativo"
              exit 0
            fi
            cd ..
            sleep $((tentativo * 2 + RANDOM % 3))
          done
          echo "Pubblicazione non riuscita dopo 6 tentativi"
          exit 1
