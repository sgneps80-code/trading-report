name: Analisi tecnica - collaudo (solo branch di sviluppo)

# Collaudo del generatore su dati reali: test degli indicatori, verifica
# delle fonti, file di prova con posizioni FITTIZIE (tests/config_prova.json).
# Gira solo sui push del branch di sviluppo; nessun dato personale coinvolto.

on:
  push:
    branches: ['claude/analisi-tecnica']

permissions:
  contents: write

jobs:
  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-analisi.txt pytest TA-Lib
      - name: Test indicatori (valori noti + TA-Lib) e generazione offline
        run: python -m pytest tests -q 2>&1 | tee esito_test.txt
      - name: Verifica fonti
        run: python verifica_fonti.py | tail -5
      - name: File di prova
        run: |
          mkdir -p out
          python genera_analisi.py --modo titolo --simbolo SAN.PA --config tests/config_prova.json --out out
          python genera_analisi.py --modo portafoglio --config tests/config_prova.json --out out
          python genera_analisi.py --modo titolo --simbolo PHAU.MI --config tests/config_prova.json --out out
          cp ~/Downloads/verifica_fonti_*.md out/ ; cp esito_test.txt out/
          ls -la out
      - name: Pubblica risultati sul branch di collaudo
        run: |
          cd out
          git init -q && git checkout -q --orphan claude/analisi-prova-output
          git add -A
          git -c user.name=trading-bot -c user.email=bot@trading-report commit -qm "collaudo $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/analisi-prova-output
