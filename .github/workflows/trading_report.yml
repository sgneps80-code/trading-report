name: Daily Trading Report

on:
  schedule:
    # 10:30 ora italiana estiva (CEST = UTC+2) → 08:30 UTC
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate HTML report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Encrypt with Staticrypt
        run: |
          npm install -g @hscrypto/staticrypt
          staticrypt docs/index.html \
            --password "${{ secrets.SITE_PASSWORD }}" \
            --output docs/index.html \
            --remember 7 \
            --template-title "Trading Report" \
            --no-export

      - name: Commit and push report
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@trading-report"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "report: $(date +'%Y-%m-%d')"
          git push
