name: Daily Trading Report

on:
  schedule:
    # 10:30 ora italiana estiva (CEST = UTC+2) → 08:30 UTC
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      portfolio_json:
        description: 'Portfolio JSON aggiornato (lascia vuoto per run schedulato)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate HTML report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          PORTFOLIO_INPUT: ${{ inputs.portfolio_json }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python generate_report.py

      - name: Salva portafoglio aggiornato come secret
        if: ${{ inputs.portfolio_json != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_PORTFOLIO: ${{ inputs.portfolio_json }}
        run: echo "$NEW_PORTFOLIO" | gh secret set PORTFOLIO_JSON

      - name: Commit and push report
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@trading-report"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "report: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
