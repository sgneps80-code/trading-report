name: Daily Trading Report

on:
  schedule:
    # 22:30 ora italiana estiva (CEST = UTC+2) → 20:30 UTC, dopo la
    # chiusura di Wall Street (16:00 ET). In inverno (CET = UTC+1) questo
    # stesso orario UTC corrisponde alle 21:30 italiane — un'ora prima,
    # perché il cron di GitHub Actions è fisso in UTC e non segue il
    # cambio d'ora. Da aggiornare qui se serve tornare a 22:30 anche
    # d'inverno.
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      portfolio_json:
        description: 'Portfolio JSON aggiornato (lascia vuoto per run schedulato)'
        required: false
        default: ''
      movimenti_xlsx_b64:
        description: 'Dossier XLS in base64, dalla pagina del report (lascia vuoto per run schedulato)'
        required: false
        default: ''
      isin_map_json:
        description: 'Mappa ISIN->TradingView JSON, dalla pagina del report (lascia vuoto per run schedulato)'
        required: false
        default: ''
      regole_posizioni_yaml:
        description: 'Regole di posizione YAML, dalla pagina del report (lascia vuoto per run schedulato)'
        required: false
        default: ''
      movimenti_storico_reset_json:
        description: 'Manutenzione: sostituisce interamente lo storico movimenti accumulato (mai dalla pagina normale)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Maschera i dati personali degli input prima di ogni altro log
        # ATTENZIONE, corretto qui dopo una fuga di dati reale: la versione
        # precedente usava echo "::add-mask::${{ inputs.x }}" — GitHub
        # sostituisce ${{ }} nel TESTO del comando e lo stampa nella riga
        # "Run ..." PRIMA di eseguirlo, quindi il valore vero finiva
        # comunque in chiaro nel log, nello stesso step nato per nasconderlo
        # (bug noto di GitHub Actions: actions/runner#475, #643). Nessun
        # ${{ }} sugli input in questo step, per nessun motivo: si legge il
        # valore a runtime da GITHUB_EVENT_PATH (il payload dell'evento),
        # cosi' non compare mai ne' nel testo del comando ne' in un blocco
        # env — il masking scatta come primissima cosa che questo script fa.
        run: |
          for campo in portfolio_json movimenti_xlsx_b64 isin_map_json regole_posizioni_yaml movimenti_storico_reset_json; do
            valore=$(python3 -c "import json; print(json.load(open('$GITHUB_EVENT_PATH', encoding='utf-8')).get('inputs', {}).get('$campo') or '')")
            if [ -n "$valore" ]; then
              echo "::add-mask::$valore"
            fi
          done

      - name: Generate HTML report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          PORTFOLIO_INPUT: ${{ inputs.portfolio_json }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # Repo pubblico: dati personali (dossier, ISIN, regole, watchlist,
          # sale per pseudonimizzare lo storico) SOLO da secret, mai committati.
          # Un input manuale (dalla pagina del report) vale per il run corrente
          # anche prima che lo step sotto lo salvi come secret per i run futuri.
          MOVIMENTI_XLSX_B64: ${{ inputs.movimenti_xlsx_b64 != '' && inputs.movimenti_xlsx_b64 || secrets.MOVIMENTI_XLSX_B64 }}
          ISIN_MAP_JSON: ${{ inputs.isin_map_json != '' && inputs.isin_map_json || secrets.ISIN_MAP_JSON }}
          REGOLE_POSIZIONI_YAML: ${{ inputs.regole_posizioni_yaml != '' && inputs.regole_posizioni_yaml || secrets.REGOLE_POSIZIONI_YAML }}
          WATCHLIST_YAML: ${{ secrets.WATCHLIST_YAML }}
          STORICO_SALT: ${{ secrets.STORICO_SALT }}
          # Movimenti accumulati dai caricamenti precedenti (formato
          # "Movimenti Dossier Titoli"): permette di caricare solo l'ultimo
          # pezzo di storico ogni volta, non tutto da capo. Lo step sotto
          # salva la versione aggiornata (accumulo + questo caricamento).
          MOVIMENTI_STORICO_JSON: ${{ secrets.MOVIMENTI_STORICO_JSON }}
          # Manutenzione esplicita (mai dalla pagina normale): se presente,
          # sostituisce l'accumulo invece di unirvisi. Vedi portfolio_sync.py.
          MOVIMENTI_STORICO_RESET_JSON: ${{ inputs.movimenti_storico_reset_json }}
          # Il run schedulato parte a mercati USA chiusi (22:30 italiane):
          # la data mostrata sul report è quella del giorno dopo, il
          # giorno in cui verrà letto. Un run manuale (workflow_dispatch,
          # es. dopo aver caricato il dossier) resta datato al giorno
          # stesso, non ha lo stesso significato "sera per il domani".
          REPORT_DATE_OFFSET_DAYS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python generate_report.py

      - name: Salva dati personali aggiornati come secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_PORTFOLIO: ${{ inputs.portfolio_json }}
          NEW_MOVIMENTI: ${{ inputs.movimenti_xlsx_b64 }}
          NEW_ISIN_MAP: ${{ inputs.isin_map_json }}
          NEW_REGOLE: ${{ inputs.regole_posizioni_yaml }}
        # Valori passati via env, non interpolati direttamente nello script:
        # un input che contenesse `"` o `` ` `` interpolato inline in un
        # comando shell sarebbe un'iniezione di comandi sul runner.
        run: |
          if [ -n "$NEW_PORTFOLIO" ]; then printf '%s' "$NEW_PORTFOLIO" | gh secret set PORTFOLIO_JSON; fi
          if [ -n "$NEW_MOVIMENTI" ]; then printf '%s' "$NEW_MOVIMENTI" | gh secret set MOVIMENTI_XLSX_B64; fi
          if [ -n "$NEW_ISIN_MAP" ]; then printf '%s' "$NEW_ISIN_MAP" | gh secret set ISIN_MAP_JSON; fi
          if [ -n "$NEW_REGOLE" ]; then printf '%s' "$NEW_REGOLE" | gh secret set REGOLE_POSIZIONI_YAML; fi
          # Movimenti accumulati (vedi step sopra): passati per file, non per
          # env, perché generate_report.py li calcola a runtime — non sono
          # un input noto in anticipo da poter mascherare con ::add-mask::.
          if [ -s /tmp/movimenti_storico_merged.json ]; then
            gh secret set MOVIMENTI_STORICO_JSON < /tmp/movimenti_storico_merged.json
            rm -f /tmp/movimenti_storico_merged.json
          fi

      - name: Commit and push report
        env:
          REPORT_DATE_OFFSET_DAYS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@trading-report"
          git add docs/index.html data/storico_indicatori.csv
          git diff --staged --quiet || git commit -m "report: $(date -u -d "+${REPORT_DATE_OFFSET_DAYS} day" +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
