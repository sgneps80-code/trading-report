name: Daily Trading Report

on:
  schedule:
    # 10:30 ora italiana estiva (CEST = UTC+2) → 08:30 UTC
    # In inverno (CET = UTC+1) il report arriverà alle 09:30 italiana
    - cron: '30 6 * * 1-5'
  workflow_dispatch:  # permette l'esecuzione manuale dalla UI di GitHub

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and upload trading report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python generate_report.py
